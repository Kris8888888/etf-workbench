name: 每日更新行情

on:
  schedule:
    # UTC 09:30 = 北京 17:30，周一到周五。腾讯日线收盘后一两小时内各节点才出齐。
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 拉取腾讯增量并还原分红
        run: node update.js
      - name: 有变化就提交
        run: |
          if git diff --quiet -- data.js; then
            echo "no change"; exit 0
          fi
          git config user.name "etf-data-bot"
          git config user.email "317863554+Kris8888888@users.noreply.github.com"
          git add data.js
          git commit -m "data: $(node -e "const t=require('fs').readFileSync('data.js','utf8');const d=JSON.parse(t.slice(t.indexOf('=')+1).replace(/;\s*$/,''));console.log(d.cal[d.cal.length-1])")"
          git push
